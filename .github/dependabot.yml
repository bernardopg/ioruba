version: 2

updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Sao_Paulo
    open-pull-requests-limit: 8
    commit-message:
      prefix: "chore"
      include: scope
    labels:
      - dependencies
      - npm
    groups:
      react:
        patterns:
          - react
          - react-dom
          - "@types/react"
          - "@types/react-dom"
        update-types:
          - minor
          - patch
      npm-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    cooldown:
      default: 7
      semver-major: 30

  - package-ecosystem: cargo
    directory: "/apps/desktop/src-tauri"
    schedule:
      interval: weekly
      day: monday
      time: "06:10"
      timezone: America/Sao_Paulo
    open-pull-requests-limit: 6
    commit-message:
      prefix: "chore"
      include: scope
    labels:
      - dependencies
      - rust
    ignore:
      # Vendorizados com patch local em src-tauri/vendor via [patch.crates-io];
      # bump de spec sem re-vendorizar quebraria o backport (glib 0.18.x) e o
      # fix de terminadores de linha (serialplugin 3.0.2).
      - dependency-name: glib
      - dependency-name: tauri-plugin-serialplugin
    groups:
      cargo-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    cooldown:
      default: 7
      semver-major: 30

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Sao_Paulo
    open-pull-requests-limit: 8
    commit-message:
      prefix: "chore"
      include: scope
    labels:
      - dependencies
      - github-actions
    ignore:
      - dependency-name: dtolnay/rust-toolchain
    groups:
      actions:
        patterns:
          - "*"
        exclude-patterns:
          - dtolnay/rust-toolchain
    cooldown:
      default: 7
      semver-major: 30
