[package]
name = "ioruba-desktop"
version = "1.10.4"
description = "Ioruba desktop control deck"
authors = ["Bernardo Gomes"]
license = "MIT"
edition = "2021"
rust-version = "1.100.0"

[lib]
name = "ioruba_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.5", features = [] }

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tauri = { version = "2.12.6", features = ["tray-icon"] }
tauri-plugin-autostart = "2.7.0"
tauri-plugin-dialog = "2.8.4"
tauri-plugin-global-shortcut = "2.4.1"
tauri-plugin-opener = "2.7.3"
tauri-plugin-process = "2.4.0"
tauri-plugin-serialplugin = "4.2.2"
tauri-plugin-single-instance = "2.5.5"
thiserror = "2.0.21"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = [
  "Win32_Foundation",
  "Win32_Media_Audio",
  "Win32_Media_Audio_Endpoints",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Variant",
] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2.14.1"

[target.'cfg(target_os = "linux")'.dependencies]
# Usado apenas para instalar um filtro de log GLib e suprimir o aviso de
# depreciacao do libayatana-appindicator (ver lib.rs). Ja vem no grafo via
# gtk/wry; a versao acompanha o patch vendorizado abaixo.
glib = "0.18"
auto-launch = "0.6.0"

[patch.crates-io]
# Linux Tauri still pulls gtk-rs GTK3 through wry/webkit2gtk. Upstream fixed
# GHSA-wrw7-89jp-8q8g in glib >= 0.20, but the current Tauri Linux stack is on
# glib 0.18.x, so we backport the one-line fix locally until upstream moves.
glib = { path = "vendor/glib-0.18.5" }
